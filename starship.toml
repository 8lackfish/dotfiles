"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = "$hostname$directory$git_branch$git_commit$status\n$character"

[hostname]
format = '[$hostname]($style) '
style = 'dimmed #9D6FC4'

[directory]
style = 'italic #7fbbb3'

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
style = 'dimmed fg:#da7756'

[git_commit]
style = 'dimmed fg:#da7756'

[status]
disabled = false
format = '[\($status\)]($style) '
style = '#c51b1a'

[character]
success_symbol = '[❯](#7fbbb3) '
error_symbol = '[](#c51b1a) '
vimcmd_symbol = '[❮](#7fbbb3) '
